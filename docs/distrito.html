<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BairroScore</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,sans-serif;background:#f9fafb;color:#1a1a1a}
.container{max-width:700px;margin:0 auto;padding:20px}
h1{font-size:24px;margin-bottom:4px}
.subtitle{color:#666;font-size:14px;margin-bottom:20px}
.score-card{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:20px}
.score-big{font-size:48px;font-weight:700}
.score-label{font-size:14px;color:#666}
.scores-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin:20px 0}
.sc{background:#f5f5f5;padding:12px;border-radius:8px;text-align:center}
.sc .val{font-size:22px;font-weight:700}
.sc .lbl{font-size:11px;color:#666;margin-top:4px}
.dados{background:#fff;border-radius:12px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.08);margin-bottom:20px}
.dados h2{font-size:16px;margin-bottom:12px}
.dados p{margin:8px 0;font-size:14px;color:#444}
.dados p span{font-weight:600}

/* painéis colapsáveis de amenidades */
.amenidades{padding:12px 16px}
.amenidades h2{margin:8px 4px 12px}
.amenidades details{border:1px solid #eef2f5;border-radius:10px;margin-bottom:8px;background:#fff}
.amenidades details[open]{background:#fafcfa;border-color:#d1fae5}
.amenidades summary{list-style:none;cursor:pointer;padding:12px 14px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:space-between;border-radius:10px;user-select:none}
.amenidades summary::-webkit-details-marker{display:none}
.amenidades summary::after{content:"▾";color:#9ca3af;font-size:12px;transition:transform .15s}
.amenidades details[open] summary::after{transform:rotate(180deg)}
.amenidades summary:hover{background:#f5faf7}
.amenidades .count{color:#059669;font-size:12px;font-weight:600;margin-left:auto;margin-right:10px}
.amenidades .count.empty{color:#9ca3af}
.amenidades .lista{padding:6px 14px 14px}
.amenidades ul{list-style:none;padding:0;margin:4px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.amenidades ul li{margin:0}
.amenidades ul a{display:block;padding:8px 10px;background:#f9fafb;color:#1f2937;text-decoration:none;border-radius:6px;font-size:13px;border:1px solid #f1f5f9;line-height:1.3}
.amenidades ul a:hover{background:#ecfdf5;border-color:#d1fae5;color:#065f46}
.amenidades ul a::before{content:"📍 ";opacity:.55}
.amenidades .status{color:#6b7280;font-size:13px;padding:6px 2px}
.amenidades .status.error{color:#b91c1c}
.amenidades .footer{font-size:11px;color:#9ca3af;margin:10px 4px 4px;text-align:right}
@media (max-width:500px){.amenidades ul{grid-template-columns:1fr}}

.nav{margin:20px 0;font-size:13px}
.nav a{color:#10b981;text-decoration:none}
</style>
</head>
<body>
<div class="container">
<div class="nav"><a href="./">← Voltar ao mapa</a></div>
<div id="content">Carregando...</div>
</div>
<script>
function gc(s){return s>=8?'#10b981':s>=7?'#34d399':s>=6?'#84cc16':s>=5?'#eab308':s>=4?'#f97316':'#ef4444';}
function lb(s){return s>=8?'Excelente':s>=7?'Muito bom':s>=6?'Bom':s>=5?'Regular':s>=4?'Ruim':'Péssimo';}
function titleCase(str){return str.toLowerCase().replace(/\b\w/g,function(l){return l.toUpperCase()});}
function escHtml(s){return String(s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]});}

function pointInPolygon(lon, lat, ring){
  var inside = false;
  for (var i=0, j=ring.length-1; i<ring.length; j=i++) {
    var xi = ring[i][0], yi = ring[i][1];
    var xj = ring[j][0], yj = ring[j][1];
    var intersect = ((yi>lat)!==(yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

// Categorias do painel "O que tem por perto".
// `filter` é o corpo do seletor Overpass (ex.: `["amenity"="pharmacy"]["name"]`)
// `types` define quais tipos de feature consultar (node/way/relation)
var CATEGORIES = [
  {id:'parques',    icon:'🌳', label:'Parques e praças',
   types:['way','relation'], filter:'["leisure"~"^(park|garden|nature_reserve)$"]["name"]'},
  {id:'mercados',   icon:'🛒', label:'Mercados e mercearias',
   types:['node','way'], filter:'["shop"~"^(supermarket|convenience|greengrocer|butcher|bakery)$"]["name"]'},
  {id:'saude',      icon:'🏥', label:'Hospitais e clínicas',
   types:['node','way'], filter:'["amenity"~"^(hospital|clinic|doctors)$"]["name"]'},
  {id:'farmacias',  icon:'💊', label:'Farmácias',
   types:['node','way'], filter:'["amenity"="pharmacy"]["name"]'},
  {id:'escolas',    icon:'🏫', label:'Escolas e universidades',
   types:['node','way'], filter:'["amenity"~"^(school|kindergarten|college|university)$"]["name"]'},
  {id:'restaurantes', icon:'🍽️', label:'Restaurantes e cafés',
   types:['node','way'], filter:'["amenity"~"^(restaurant|cafe|fast_food)$"]["name"]'},
  {id:'esportes',   icon:'🏋️', label:'Academias e esportes',
   types:['node','way'], filter:'["leisure"~"^(fitness_centre|sports_centre|stadium)$"]["name"]'},
  {id:'transporte', icon:'🚇', label:'Estações de metrô/trem',
   types:['node','way'], filter:'["railway"~"^(station|halt)$"]["name"]'}
];

function buildOverpassQuery(cat, bbox){
  var parts = cat.types.map(function(t){ return t + cat.filter + '(' + bbox + ');'; });
  return '[out:json][timeout:25];(' + parts.join('') + ');out center tags;';
}

function fetchCategory(cat, slug, feat){
  var ring = feat.geometry.coordinates[0];
  var lats = ring.map(function(p){return p[1]});
  var lngs = ring.map(function(p){return p[0]});
  var bbox = Math.min.apply(null,lats)+','+Math.min.apply(null,lngs)+','+Math.max.apply(null,lats)+','+Math.max.apply(null,lngs);
  var query = buildOverpassQuery(cat, bbox);

  return fetch('https://overpass-api.de/api/interpreter', {
    method:'POST',
    body:'data=' + encodeURIComponent(query)
  })
  .then(function(r){ if(!r.ok) throw new Error('overpass '+r.status); return r.json(); })
  .then(function(d){
    var items = (d.elements || []).map(function(e){
      var c = e.center || {lat: e.lat, lon: e.lon};
      return {name:(e.tags && e.tags.name) || '', lat:c.lat, lon:c.lon};
    }).filter(function(p){ return p.name && p.lat!=null && p.lon!=null; });

    items = items.filter(function(p){ return pointInPolygon(p.lon, p.lat, ring); });

    var seen = {};
    items = items.filter(function(p){
      var k = p.name.trim().toLowerCase();
      if (seen[k]) return false;
      seen[k] = true;
      return true;
    });
    items.sort(function(a,b){ return a.name.localeCompare(b.name, 'pt-BR'); });
    return items;
  });
}

function renderCategory(detailsEl, items){
  var countEl = detailsEl.querySelector('.count');
  var listEl  = detailsEl.querySelector('.lista');
  countEl.textContent = items.length;
  countEl.classList.toggle('empty', items.length === 0);

  if (!items.length) {
    listEl.innerHTML = '<p class="status">Nada mapeado no OpenStreetMap pra essa região.</p>';
    return;
  }
  var html = '<ul>';
  items.forEach(function(p){
    var url = 'https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=' + p.lat + ',' + p.lon;
    html += '<li><a href="'+url+'" target="_blank" rel="noopener" title="Abrir no Street View">'+escHtml(p.name)+'</a></li>';
  });
  html += '</ul>';
  listEl.innerHTML = html;
}

function loadCategory(detailsEl, cat, slug, feat){
  if (detailsEl.dataset.loaded) return;
  detailsEl.dataset.loaded = '1';

  var cacheKey = 'amen_' + slug + '_' + cat.id;
  try {
    var cached = sessionStorage.getItem(cacheKey);
    if (cached) { renderCategory(detailsEl, JSON.parse(cached)); return; }
  } catch(e){}

  var listEl = detailsEl.querySelector('.lista');
  listEl.innerHTML = '<p class="status">Carregando do OpenStreetMap…</p>';

  fetchCategory(cat, slug, feat)
    .then(function(items){
      try { sessionStorage.setItem(cacheKey, JSON.stringify(items)); } catch(e){}
      renderCategory(detailsEl, items);
    })
    .catch(function(){
      detailsEl.dataset.loaded = '';
      listEl.innerHTML = '<p class="status error">Erro ao consultar a Overpass API. Feche e reabra pra tentar de novo.</p>';
    });
}

function buildAmenidadesHtml(){
  var html = '<div class="dados amenidades"><h2>🗺️ O que tem por perto</h2>';
  CATEGORIES.forEach(function(cat){
    html +=
      '<details data-cat="'+cat.id+'">'+
        '<summary>'+cat.icon+' '+cat.label+' <span class="count"></span></summary>'+
        '<div class="lista"></div>'+
      '</details>';
  });
  html += '<p class="footer">Dados: OpenStreetMap · links abrem no Google Street View</p>';
  html += '</div>';
  return html;
}

function attachAmenidades(slug, feat){
  var root = document.querySelector('.amenidades');
  if (!root) return;
  var byId = {};
  CATEGORIES.forEach(function(c){ byId[c.id] = c; });
  root.querySelectorAll('details[data-cat]').forEach(function(d){
    d.addEventListener('toggle', function(){
      if (d.open) loadCategory(d, byId[d.dataset.cat], slug, feat);
    });
  });
}

var slug = new URLSearchParams(window.location.search).get('d');
if(!slug){
  document.getElementById('content').innerHTML='<p>Distrito não encontrado. <a href="./">Voltar ao mapa</a></p>';
} else {
  fetch('municipios/manifest.json')
    .then(function(r){return r.json()})
    .then(function(manifest){
      var promises = manifest.map(function(m){return fetch(m.arquivo).then(function(r){return r.json()})});
      return Promise.all(promises);
    })
    .then(function(results){
      var feat = null;
      for(var i=0;i<results.length;i++){
        var found = results[i].features.find(function(f){
          return f.properties.nm_distrito_municipal.toLowerCase().replace(/ /g,'-') === slug;
        });
        if(found){feat=found;break;}
      }
      if(!feat){
        document.getElementById('content').innerHTML='<p>Distrito "'+slug+'" não encontrado. <a href="./">Voltar ao mapa</a></p>';
        return;
      }
      var p=feat.properties;
      var sg=p.score_geral;
      var color=gc(sg);
      var nome=titleCase(p.nm_distrito_municipal);
      document.title='Morar em '+nome+' — Score '+sg+'/10 | BairroScore';
      document.getElementById('content').innerHTML=
        '<h1>'+nome+'</h1>'+
        '<p class="subtitle">'+(p.municipio||'São Paulo')+', SP · '+(p.nm_regiao_05||'')+'</p>'+
        '<div class="score-card">'+
        '<span class="score-big" style="color:'+color+'">'+sg+'</span>'+
        '<span class="score-label"> / 10 — '+lb(sg)+'</span>'+
        '<div class="scores-grid">'+
        '<div class="sc"><div class="val" style="color:'+gc(p.score_seguranca)+'">'+p.score_seguranca+'</div><div class="lbl">🛡️ Segurança</div></div>'+
        '<div class="sc"><div class="val" style="color:'+gc(p.score_custo)+'">'+p.score_custo+'</div><div class="lbl">💰 Custo</div></div>'+
        '<div class="sc"><div class="val" style="color:'+gc(p.score_transporte)+'">'+p.score_transporte+'</div><div class="lbl">🚇 Transporte</div></div>'+
        '<div class="sc"><div class="val" style="color:'+gc(p.score_verde||0)+'">'+(p.score_verde||'—')+'</div><div class="lbl">🌳 Áreas verdes</div></div>'+
        '<div class="sc"><div class="val" style="color:'+gc(p.score_comercio||0)+'">'+(p.score_comercio||'—')+'</div><div class="lbl">🏪 Comércio</div></div>'+
        '</div></div>'+
        '<div class="dados"><h2>Dados de '+nome+'</h2>'+
        '<p>🏠 <span>Preço m²:</span> R$ '+(p.preco_m2||0).toLocaleString('pt-BR')+'</p>'+
        '<p>🔫 <span>Roubos:</span> '+(p.roubos_100k||'—')+'/100k habitantes</p>'+
        '<p>💀 <span>Homicídios:</span> '+(p.homicidios_100k||'—')+'/100k habitantes</p>'+
        '<p>🚉 <span>Metrô:</span> '+(p.dist_metro_km||'—')+' km</p>'+
        '<p>🌳 <span>Área verde:</span> '+(p.area_verde_m2_hab||'—')+' m²/habitante</p>'+
        '<p>🏪 <span>Comércio:</span> '+(p.comercio_km2||'—')+' estabelecimentos/km²</p>'+
        '</div>'+
        buildAmenidadesHtml()+
        '<div class="nav" style="margin-top:30px;text-align:center">'+
        '<p style="color:#999;font-size:11px">Dados: SSP-SP 2024 · FipeZap 2025 · SVMA · Junta Comercial · OpenStreetMap</p>'+
        '<a href="./">Ver todos os distritos no mapa</a></div>';

      attachAmenidades(slug, feat);
    });
}
</script>
</body>
</html>
