<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BairroScore - São Paulo</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        #map { width: 100%; height: 100vh; }
        .info { position: fixed; top: 60px; right: 10px; background: white; padding: 14px 18px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 1000; min-width: 220px; font-size: 13px; }
        .info h4 { margin-bottom: 8px; font-size: 15px; }
        .info .score { font-size: 28px; font-weight: 700; }
        .info .detail { margin: 4px 0; color: #555; }
        .legend { position: fixed; bottom: 20px; left: 20px; background: white; padding: 14px 18px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); z-index: 1000; font-size: 12px; }
        .legend h4 { margin-bottom: 8px; font-size: 13px; }
        .legend i { width: 18px; height: 12px; display: inline-block; margin-right: 6px; border-radius: 2px; }
        .legend .item { margin: 4px 0; }
        .header { position: fixed; top: 0; left: 0; right: 0; z-index: 1000; background: white; padding: 10px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: space-between; }
        .header h1 { font-size: 20px; font-weight: 700; }
        .header h1 span { color: #10b981; }
        .header p { font-size: 12px; color: #666; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Bairro<span>Score</span></h1>
        <p>📍 São Paulo — 96 distritos · Dados SSP-SP 2024</p>
    </div>
    <div id="map"></div>
    <div class="info" id="info">
        <h4>Passe o mouse num distrito</h4>
        <p class="detail">Clique pra mais detalhes</p>
    </div>
    <div class="legend">
        <h4>🛡️ Score Segurança</h4>
        <div class="item"><i style="background:#10b981"></i> 7-10 Muito seguro</div>
        <div class="item"><i style="background:#84cc16"></i> 5-7 Seguro</div>
        <div class="item"><i style="background:#f59e0b"></i> 3-5 Médio</div>
        <div class="item"><i style="background:#ef4444"></i> 0-3 Perigoso</div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([-23.55, -46.63], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        function getColor(score) {
            return score >= 7 ? '#10b981' : score >= 5 ? '#84cc16' : score >= 3 ? '#f59e0b' : '#ef4444';
        }

        function style(feature) {
            const score = feature.properties.score_seguranca || 5;
            return { fillColor: getColor(score), weight: 1.5, color: '#fff', fillOpacity: 0.6 };
        }

        const info = document.getElementById('info');

        function highlightFeature(e) {
            const layer = e.target;
            layer.setStyle({ weight: 3, fillOpacity: 0.8 });
            const p = layer.feature.properties;
            const score = p.score_seguranca || 5;
            const color = getColor(score);
            info.innerHTML = '<h4>' + p.nm_distrito_municipal + '</h4>' +
                '<div class="score" style="color:' + color + '">' + score.toFixed(1) + '/10</div>' +
                '<p class="detail">🔫 Roubos: ' + (p.roubos_100k || '?') + '/100k hab</p>' +
                '<p class="detail">💀 Homicídios: ' + (p.homicidios_100k || '?') + '/100k hab</p>' +
                '<p class="detail">📍 Região: ' + (p.nm_regiao_05 || '') + '</p>';
        }

        function resetHighlight(e) {
            geojsonLayer.resetStyle(e.target);
        }

        function onEachFeature(feature, layer) {
            layer.on({ mouseover: highlightFeature, mouseout: resetHighlight });
        }

        fetch('sp_distritos_scores.json')
            .then(r => r.json())
            .then(data => {
                window.geojsonLayer = L.geoJSON(data, { style: style, onEachFeature: onEachFeature }).addTo(map);
            });
    </script>
</body>
</html>
